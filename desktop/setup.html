<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Cordial</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<style>
  * { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: #1e1f22; color: #dbdee1; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { width: min(440px, 100%); background: #313338; border-radius: 10px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  img { display: block; margin: 0 auto 12px; width: 64px; height: 64px; border-radius: 16px; }
  h1 { margin: 0 0 6px; font-size: 24px; text-align: center; color: #f2f3f5; } p { margin: 0 0 20px; text-align: center; color: #a0a6ae; }
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #a0a6ae; }
  input { width: 100%; padding: 11px 12px; border: 0; border-radius: 4px; background: #1e1f22; color: inherit; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid #8c96ff; outline-offset: 2px; }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 4px; background: #5865f2; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  button:hover { background: #4752c4; } button[disabled] { opacity: .6; cursor: wait; }
  .err { min-height: 22px; margin-top: 12px; color: #f23f43; font-size: 14px; }
</style></head>
<body><main>
  <img src="assets/icon.png" alt="">
  <h1>Bienvenue sur Cordial</h1>
  <p>Saisissez l'adresse du serveur de votre communauté.</p>
  <form id="f"><label for="u">Adresse du serveur</label><input id="u" placeholder="https://chat.monsite.fr" autocomplete="off" spellcheck="false" autofocus>
  <div class="err" id="e" role="alert"></div><button id="b" type="submit">Se connecter</button></form>
</main><script src="setup.js"></script></body></html>
