<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Cordial</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<style>
  * { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: #1e1f22; color: #dbdee1; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; }
  main { width: min(460px, 100%); } h1 { margin: 0 0 8px; font-size: 24px; color: #f2f3f5; } p { margin: 0 0 8px; color: #a0a6ae; } code { color: #dbdee1; overflow-wrap: anywhere; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  button { padding: 10px 20px; border: 0; border-radius: 4px; background: #5865f2; color: #fff; font: 600 15px system-ui, sans-serif; cursor: pointer; } button:hover { background: #4752c4; }
  button.ghost { background: #404249; } button.ghost:hover { background: #4a4d55; } button:focus-visible { outline: 2px solid #8c96ff; outline-offset: 2px; }
</style></head>
<body><main>
  <h1>Impossible de joindre le serveur</h1>
  <p>Vérifiez votre connexion Internet, puis réessayez.</p>
  <p><code id="u"></code></p>
  <div class="row"><button id="r">Réessayer</button><button id="c" class="ghost">Changer de serveur</button></div>
</main><script src="offline.js"></script></body></html>
